<!DOCTYPE html><html>
<head>
<title>Smart Shelf</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
    
body{
    background:#f5f5f5;
    margin:0;
}

/* Navbar */
.navbar-custom{
    background:white;
    border-bottom:1px solid #ddd;
    padding:10px 15px;
}

/* Card */
.product-card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

/* Layout */
.product-layout{
    display:flex;
    gap:15px;
    align-items:flex-start;
}

/* Image */
.product-image{
    width:120px;
    height:120px;
    object-fit:cover;
    border:1px solid #ccc;
    border-radius:8px;
}

/* Info */
.product-info{
    flex:1;
}

.product-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

/* lines fix (IMPORTANT) */
.info-line{
    margin-bottom:6px;
    display:block;
}

/* status dot */
.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    display:inline-block;
    margin-left:6px;
}
    
    .dot-green{
    background:#28a745;
    box-shadow:
    0 0 8px #28a745,
    0 0 15px #28a745;
}

.dot-orange{
    background:#ff9800;
    box-shadow:
    0 0 8px #ff9800,
    0 0 15px #ff9800;
}

.dot-red{
    background:#dc3545;
    box-shadow:
    0 0 8px #dc3545,
    0 0 15px #dc3545;
}
    

/* buttons */
.actions{
    margin-top:10px;
}

.actions button{
    margin-right:5px;
    margin-bottom:5px;
}
    
.status-text{
    font-size:6px;
    font-weight:bold;
    margin-left:4px;
}
    
.text-green{
    color:#28a745;
    text-shadow:0 0 8px #28a745;
}

.text-orange{
    color:#ff8800;
    text-shadow:0 0 8px #ff8800;
}

.text-red{
    color:#dc3545;
    text-shadow:0 0 8px #dc3545;
}
    
.notification{
    background:white;
    padding:10px;
    margin-bottom:8px;
    border-radius:8px;
    border-left:4px solid orange;
    font-size:14px;
}

.notification-danger{
    border-left:4px solid red;
}

.notification-warning{
    border-left:4px solid orange;
}
    
.notification-time{
    font-size:11px;
    color:#888;
}
    
.notification-message{
    font-size:12px;
}

.notification-message b{
    font-size:13px;
}
    
.delete-all{
    font-weight:bold;
    cursor:pointer;
}

.delete-all:hover{
    background:#f8f9fa;
}
    
.notif-item{
    position:relative;
}

.notif-x{
    position:absolute;
    right:8px;
    top:6px;

    font-size:12px;
    color:#999;
    opacity:0;

    cursor:pointer;

    transition:0.2s;
}

.notif-item:hover .notif-x{
    opacity:1;
}

.notif-x:hover{
    color:#dc3545;
}
    
.wifi-indicator{

width:8px;
height:8px;

border-radius:50%;

display:inline-block;

margin-right:6px;

background:#bdbdbd;

}

.wifi-online{

background:#00ff66;

box-shadow:
0 0 8px #00ff66,
0 0 15px #00ff66,
0 0 25px #00ff66;

}
    
.image-container{

position:relative;

width:120px;
height:120px;

}


.image-container .product-image{

width:120px;
height:120px;

}


.image-upload-btn{

position:absolute;

bottom:5px;
right:5px;

width:30px;
height:30px;

border-radius:50%;

border:1px solid #ccc;

background:white;

cursor:pointer;

font-size:15px;

display:flex;
align-items:center;
justify-content:center;
    
transition:0.3s;    

}    
    
/* ===== DARK MODE SWITCH ===== */

/* الإطار الخارجي */
.theme-switch{
    position:relative;
    width:70px;      /* عرض الزر */
    height:24px;     /* ارتفاع الزر */
    border-radius:50px;
    background:#e9e9e9;
    cursor:pointer;
    overflow:hidden;
    transition:.4s;
}

.theme-switch.dark{
    background:#000;
}

/* قرص الشمس / القمر */
.theme-slider{
    position:absolute;
    top:2px;         /* المسافة من الأعلى */
    left:2px;        /* المسافة من اليسار */

    width:20px;      /* عرض القرص */
    height:20px;     /* ارتفاع القرص */

    border-radius:50%;
    background:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;  /* حجم رمز الشمس والقمر */

    transition:.4s;
}

/* مكان القرص في الوضع المظلم */
.theme-switch.dark .theme-slider{
    left:48px;
}

/* النص */
.theme-text{
    position:absolute;
    top:50%;
    left:25px;

    transform:translateY(-50%);

    font-weight:bold;
    font-size:6px;   /* حجم الكتابة */

    transition:.4s;
}

/* تحريك النص عند الوضع المظلم */
.theme-switch.dark .theme-text{
    left:6px;
}

.theme-switch.dark .theme-text{
    color:white;
}
    
body.dark-mode{
    background:#121212;
    color:white;
}

body.dark-mode .navbar-custom{
    background:#1e1e1e;
    border-color:#333;
}

body.dark-mode .product-card{
    background:#1e1e1e;
    color:white;
    border-color:#333;
}

body.dark-mode .modal-content{
    background:#1e1e1e;
    color:white;
}

body.dark-mode .dropdown-menu{
    background:#1e1e1e;
}

body.dark-mode .dropdown-item{
    color:white;
}    
    
body.dark-mode .btn-outline-dark{

    color:white !important;

    border-color:#888 !important;

}

body.dark-mode .btn-outline-dark:hover{

    background:#333 !important;

    color:white !important;

}

body.dark-mode .image-upload-btn{

    background:#2b2b2b;

    color:white;

    border-color:#666;

}    
    
body.dark-mode .dropdown-item:hover{

    background:#2b2b2b !important;

    color:white !important;

}
    
body.dark-mode .notification-time{

    color:#bbb !important;

}
    
body.dark-mode .notif-x{

    color:#aaa;

}    

</style></head><body><!-- NAVBAR --><div class="navbar-custom d-flex justify-content-between align-items-center">

<div>
<b>Smart Shelf</b>
</div>

<div class="d-flex align-items-center">
    
<div
class="theme-switch me-3"
id="themeSwitch"
onclick="toggleTheme()">

<div class="theme-slider" id="themeIcon">
☀️
</div>

<div class="theme-text" id="themeText">
DAY MODE
</div>

</div>    

<button
class="btn btn-outline-dark btn-sm me-2"
data-bs-toggle="modal"
data-bs-target="#wifiModal">

<span id="wifiStatusDot"
class="wifi-indicator">
</span>

WiFi Manager

</button>

<div class="dropdown">

<button
class="btn btn-outline-dark btn-sm dropdown-toggle"
data-bs-toggle="dropdown">

Notifications
(<span id="notifCount">0</span>)

</button>

<ul class="dropdown-menu dropdown-menu-end"
id="notifMenu">
</ul>

</div>

</div>

</div>
    <div class="container mt-3"><!-- PRODUCT LIST --><div id="productList"><!-- MAIN CARD --><div class="product-card"><div class="product-layout"><div class="image-container">

<img 
class="product-image main-image"
src="https://via.placeholder.com/120">


<input
type="file"
id="mainImageInput"
accept="image/*"
style="display:none"
onchange="uploadMainImage(event)">


<button
class="image-upload-btn"
onclick="document.getElementById('mainImageInput').click()">

📷

</button>

</div><div class="product-info"><div class="product-name editable-name">Product Name</div><div class="info-line">
Quantity : <span class="qty">-</span>
<span class="status-dot qty-dot"></span>
<span class="status-text qty-text">متوفر</span>
</div><div class="info-line">
Price : <span class="price">0</span>
</div><div class="info-line">
Expiry : <span class="expiry">----</span>
<span class="status-dot expiry-dot"></span>
<span class="status-text expiry-text">صالح</span>
</div><div class="actions"><button class="btn btn-outline-dark btn-sm" onclick="sendCmd('CAPTURE_WEIGHT')">
Capture Weight
</button><button class="btn btn-outline-dark btn-sm edit-btn" onclick="toggleEdit(this)">
Edit
</button><button class="btn btn-outline-dark btn-sm" onclick="deleteMainCard(this)">
Delete
</button></div></div>
</div>
</div></div><!-- ADD BUTTON --><button class="btn btn-outline-dark w-100 mt-3" onclick="addProduct()">
+ Add Product
</button></div>
<div class="modal fade" id="wifiModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">
WiFi Manager
</h5>
</div>

<div class="modal-body">

<label>WiFi Name</label>

<input
type="text"
id="wifiSSID"
class="form-control mb-3">

<label>WiFi Password</label>

<input
type="password"
id="wifiPASS"
class="form-control">

</div>

<div class="modal-footer">

<button
class="btn btn-dark"
onclick="saveWifi()">

Save

</button>

</div>

</div>

</div>

</div>
    <script>

const firebaseConfig = {
  apiKey: "apiKey",
  databaseURL: "databaseURL"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
    
    function saveWifi(){

let ssid =
document.getElementById("wifiSSID").value;

let pass =
document.getElementById("wifiPASS").value;

db.ref("WiFiConfig").set({

SSID: ssid,
PASSWORD: pass,
TIME: Date.now()

});

alert("WiFi Saved");

}
    
    db.ref("WiFiConfig").on("value", (snap)=>{

let data = snap.val();

if(!data) return;

document.getElementById("wifiSSID").value =
data.SSID || "";

document.getElementById("wifiPASS").value =
data.PASSWORD || "";

});
    
let espLastSeen = 0;

db.ref("ESPStatus/LastSeen").on("value",(snap)=>{

    espLastSeen = snap.val() || 0;

});
    
    setInterval(()=>{

    let dot =
    document.getElementById("wifiStatusDot");

    let now =
    Math.floor(Date.now()/1000);

    let diff =
    now - espLastSeen;

    console.log("ESP difference =", diff);

    if(diff <= 240){

        dot.classList.add("wifi-online");

    }
    else{

        dot.classList.remove("wifi-online");

    }

},1000);
    
    db.ref("Notifications").on("value", (snap)=>{

    notifications = [];

    snap.forEach((child)=>{

        notifications.push({
            id: child.key,
            message: child.val().message,
            time: child.val().time
        });

    });

    updateNotificationsList();

});
    
async function uploadMainImage(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }


    const formData = new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        "smart_shelf01"
    );


    try{


        const response = await fetch(

        "https://api.cloudinary.com/v1_1/ddglf1syo/image/upload",

        {
            method:"POST",
            body:formData
        }

        );


        const data = await response.json();
        
        console.log(data);

        const imageUrl = data.secure_url;
        
        



        // تغيير الصورة مباشرة في البطاقة الرئيسية

        document.querySelector(".main-image").src = imageUrl;
        



        // حفظ رابط الصورة في Firebase

        db.ref("/Shelf1").update({

            Image:imageUrl

        });



        alert("Image Uploaded Successfully");


    }
    catch(error){


        console.log(error);

        alert("Image Upload Failed");


    }

}    

/* SEND COMMAND */
function sendCmd(cmd){
    db.ref("/Shelf1/Command").set(cmd);
}

/* EDIT / SAVE BUTTON */
function toggleEdit(btn){

const card = btn.closest('.product-card');

const name = card.querySelector('.editable-name');
const price = card.querySelector('.price');
const expiry = card.querySelector('.expiry');

if(btn.innerText === "Edit"){

    const newName = prompt("Product Name", name.innerText);
    if(newName !== null) name.innerText = newName;

    const newPrice = prompt("Price", price.innerText);
    if(newPrice !== null) price.innerText = newPrice;

    const newExpiry = prompt("Expiry Date", expiry.innerText);
    if(newExpiry !== null) expiry.innerText = newExpiry;

    btn.innerText = "Save";

}
else{

    db.ref("/Shelf1").update({

        ProductName: name.innerText,
        Price: price.innerText,
        ExpiryDate: expiry.innerText

    });

    btn.innerText = "Edit";

}

}

/* ADD PRODUCT */
function addProduct(){

const container = document.getElementById("productList");

const card = document.createElement("div");
card.className = "product-card";

card.innerHTML = `

<div class="product-layout">

<img class="product-image" src="https://via.placeholder.com/120">
    
<div class="product-info">

<div class="product-name editable-name">New Product</div>

<div class="info-line">
Quantity : <span class="qty">-</span>
<span class="status-dot qty-dot"></span>
<span class="status-text qty-text">متوفر</span>
</div>

<div class="info-line">
Price : <span class="price">0</span>
</div>

<div class="info-line">
Expiry : <span class="expiry">----</span>
<span class="status-dot expiry-dot"></span>
<span class="status-text expiry-text">صالح</span>
</div>

<div class="actions">

<button class="btn btn-outline-dark btn-sm" onclick="sendCmd('CAPTURE_WEIGHT')">
Capture Weight
</button>

<button class="btn btn-outline-dark btn-sm edit-btn" onclick="toggleEdit(this)">
Edit
</button>

<button class="btn btn-outline-dark btn-sm" onclick="this.closest('.product-card').remove()">
Delete
</button>

</div>

</div>
</div>

`;

container.appendChild(card);
}
function deleteMainCard(btn){

db.ref("/Shelf1").update({
    ProductName: "",
    Price: "",
    ExpiryDate: ""
});

btn.closest('.product-card').remove();

}
    let notifications = [];
    
    let firstLoad = true;

    let lastQtyState = "";
   let lastExpiryState = "";
    
   function updateNotificationsList(){

    document.getElementById("notifMenu").innerHTML =
    notifications.map(
    (n, index) => `
    <li class="dropdown-item notif-item">

    ${n.message}
    <br>

    <small class="notification-time">
    ${timeAgo(n.time)}
    </small>

    <span class="notif-x" data-index="${index}">
    ×
    </span>

    </li>
    `
    ).join("") +

    `
    <li><hr class="dropdown-divider"></li>

    <li class="dropdown-item text-danger delete-all">
    🗑 Delete All
    </li>
    `;

    document.getElementById("notifCount").innerText =
    notifications.length;
}
    
/* LIVE FIREBASE */
    
    function timeAgo(timestamp){

    let seconds =
    Math.floor((Date.now() - timestamp)/1000);

    if(seconds < 60){
        return "منذ " + seconds + " ثانية";
    }

    let minutes =
    Math.floor(seconds/60);

    if(minutes < 60){
        return "منذ " + minutes + " دقيقة";
    }

    let hours =
    Math.floor(minutes/60);

    return "منذ " + hours + " ساعة";

}
    
   function updateNotifications(){
       
    let productName =
    document.querySelector(".editable-name").innerText;

    let qty =
    parseInt(document.querySelector(".qty").innerText) || 0;
       
       let currentQtyState = "ok";

if(qty === 0){
    currentQtyState = "out";
}
else if(qty <= 3){
    currentQtyState = "low";
}

    let expiryText =
    document.querySelector(".expiry").innerText;

    let expiryDate =
    new Date(expiryText);

    let today =
    new Date();

    let days =
    Math.ceil(
      (expiryDate - today)
      / (1000 * 60 * 60 * 24)
    );
    
    let currentExpiryState = "ok";

if(!isNaN(days)){

    if(days <= 1){
        currentExpiryState = "expired";
    }
    else if(days <= 20){
        currentExpiryState = "warning";
    }

}
    
    if(firstLoad){

    lastQtyState = currentQtyState;
    lastExpiryState = currentExpiryState;

    firstLoad = false;

    return;
}

    // Quantity

    if(currentQtyState !== lastQtyState){

    if(currentQtyState === "out"){

        notifications.push({
message:
'❌ <b>' + productName + '</b> : غير متوفر',
time:
Date.now()
});
        db.ref("Notifications").push({
message:
'❌ ' + productName + ' : غير متوفر',
time:
Date.now()
});

    }

    else if(currentQtyState === "low"){

        notifications.push({
message:
'⚠ <b>' + productName + '</b> : الكمية منخفضة',
time:
Date.now()
});
        db.ref("Notifications").push({
message:
'⚠ ' + productName + ' : الكمية منخفضة',
time:
Date.now()
});

    }

    lastQtyState = currentQtyState;

}

    // Expiry

  if(currentExpiryState !== lastExpiryState){

    if(currentExpiryState === "expired"){

        notifications.push({
message:
'❌ <b>' + productName + '</b> : منتهي الصلاحية',
time:
Date.now()
});
        db.ref("Notifications").push({
message:
'❌ ' + productName + ' : منتهي الصلاحية',
time:
Date.now()
});

    }

    else if(currentExpiryState === "warning"){

        notifications.push({
message:
'⚠ <b>' + productName + '</b> : يقترب من انتهاء الصلاحية',
time:
Date.now()
});
        db.ref("Notifications").push({
message:
'⚠ ' + productName + ' : يقترب من انتهاء الصلاحية',
time:
Date.now()
});

    }

    lastExpiryState = currentExpiryState;

}

    updateNotificationsList();
    
    }
    
 function updateStatusDots(){

    // ===== Quantity =====

    let qty =
    parseInt(document.querySelector(".qty").innerText) || 0;

    let qtyDot =
    document.querySelector(".qty-dot");

    let qtyText =
    document.querySelector(".qty-text");

    qtyDot.className = "status-dot qty-dot";
    qtyText.className = "status-text qty-text";

    if(qty > 3){

        qtyDot.classList.add("dot-green");
        qtyText.classList.add("text-green");
        qtyText.innerText = "متوفر";

    }
    else if(qty >= 1){

        qtyDot.classList.add("dot-orange");
        qtyText.classList.add("text-orange");
        qtyText.innerText = "حرج";

    }
    else{

        qtyDot.classList.add("dot-red");
        qtyText.classList.add("text-red");
        qtyText.innerText = "منتهي";

    }

    // ===== Expiry =====

    let expiryText =
    document.querySelector(".expiry").innerText;

    let expiryDot =
    document.querySelector(".expiry-dot");

    let expiryStatus =
    document.querySelector(".expiry-text");

    expiryDot.className =
    "status-dot expiry-dot";

    expiryStatus.className =
    "status-text expiry-text";

    let expiryDate =
    new Date(expiryText);

    let today =
    new Date();

    let days =
    Math.ceil(
      (expiryDate - today)
      / (1000 * 60 * 60 * 24)
    );

    if(isNaN(days)){
        return;
    }

    if(days > 20){

        expiryDot.classList.add("dot-green");
        expiryStatus.classList.add("text-green");
        expiryStatus.innerText = "صالح";

    }
    else if(days >= 2){

        expiryDot.classList.add("dot-orange");
        expiryStatus.classList.add("text-orange");
        expiryStatus.innerText = "حرج";

    }
    else{

        expiryDot.classList.add("dot-red");
        expiryStatus.classList.add("text-red");
        expiryStatus.innerText = "منتهي";

    }
     
updateNotifications(); 
     
}
    
db.ref("/Shelf1").on("value", (snap)=>{

let data = snap.val();
if(!data) return;

document.querySelector(".editable-name").innerText = data.ProductName || "Product";
document.querySelector(".qty").innerText = data.Quantity ?? "-";
document.querySelector(".price").innerText = data.Price ?? "0";
document.querySelector(".expiry").innerText = data.ExpiryDate || "----";

if(data.Image){

document.querySelector(".main-image").src =
data.Image;

document.querySelector(".image-upload-btn").style.opacity = "0.15";
    
}    
    
    
    
updateStatusDots();
    
});
    
    document.addEventListener("click", function(e){

    // حذف جميع الإشعارات
   if(e.target.classList.contains("delete-all")){

    db.ref("Notifications").remove();

}

    // حذف إشعار واحد
    if(e.target.classList.contains("notif-x")){

        let index =
e.target.getAttribute("data-index");

let notifId =
notifications[index].id;

db.ref("Notifications/" + notifId).remove();

    }

});
    
function toggleTheme(){

const body =
document.body;

const sw =
document.getElementById("themeSwitch");

const icon =
document.getElementById("themeIcon");

const text =
document.getElementById("themeText");


body.classList.toggle("dark-mode");
sw.classList.toggle("dark");


if(body.classList.contains("dark-mode")){

icon.innerHTML = "🌙";
text.innerHTML = "NIGHT MODE";

localStorage.setItem(
"theme",
"dark"
);

}
else{

icon.innerHTML = "☀️";
text.innerHTML = "DAY MODE";

localStorage.setItem(
"theme",
"light"
);

}

}


window.onload = function(){

if(
localStorage.getItem("theme")
=== "dark"
){

document.body.classList.add(
"dark-mode"
);

document.getElementById(
"themeSwitch"
).classList.add("dark");

document.getElementById(
"themeIcon"
).innerHTML = "🌙";

document.getElementById(
"themeText"
).innerHTML = "NIGHT MODE";

}

};    

</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body>
